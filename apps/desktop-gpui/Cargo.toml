[package]
name = "desktop-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# gpui and zed_ui are evolving fast; use git deps, optional feature
zed_ui = { git = "https://github.com/zed-ui/zed-ui", optional = true }
gpui = { git = "https://github.com/zed-ui/gpui", optional = true }

[features]
# Enable the GPUI window by: cargo run -p desktop-gpui --features gpui
# Default build does not pull gpui to avoid toolchain issues.
default = []
gpui = ["dep:gpui", "dep:zed_ui"]

[build-dependencies]

